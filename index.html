<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Sama Multiservices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1 id="appName"></h1>
      <div class="role-switch" id="roleSwitch">
        <button data-role="gerant" class="active">Gérante</button>
        <button data-role="proprio">Propriétaire</button>
      </div>
    </div>
    <div class="subbar" id="subbar"></div>
  </header>

  <div class="toast" id="toast"></div>

  <main id="main"></main>

  <div class="cartbar" id="cartbar">
    <div class="inner">
      <div class="cart-lines" id="cartLines"></div>
      <button class="validate" id="validateBtn">
        <span>Valider la vente</span><span class="tot" id="cartTotal"></span>
      </button>
    </div>
  </div>

  <nav id="tabbar"></nav>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/views-gerante.js"></script>
<script src="js/views-proprio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
